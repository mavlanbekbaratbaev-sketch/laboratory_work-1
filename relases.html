<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameNews - Релизы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
body { font-family: 'Arial', sans-serif; background-color: #1a1a1a; color: white; margin: 0; }
.container { width: 85%; margin: 0 auto; max-width: 1200px; }
header { background-color: #000; padding: 20px 0; border-bottom: 3px solid #ff4500; }
header h1 { margin: 0; float: left; }
header h1 span { color: #ff4500; }
header nav ul { margin: 0; padding: 0; list-style: none; float: right; }
header nav ul li { display: inline; margin-left: 20px; }
header a { text-decoration: none; color: white; font-weight: bold; }

.hero { background: #333; padding: 50px 0; text-align: center; }

.games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px 0; }
.game-card { background-color: #262626; padding: 15px; border-radius: 5px; text-align: center; }
.game-card img { max-width: 100%; height: auto; border-radius: 5px; }
.btn { display: inline-block; padding: 10px 20px; background-color: #ff4500; color: white; text-decoration: none; border-radius: 3px; margin-top: 10px; }

footer { text-align: center; padding: 30px 0; background-color: #000; margin-top: 20px; }
</style>

            <h1>Game<span>News</span></h1>

        </div>
    </footer>
</body>
</html>
